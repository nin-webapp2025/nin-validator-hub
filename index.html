<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F59E0B" />
    <title>SparklabID - Nigerian Identity Verification Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Lightning-fast Nigerian identity verification. Verify NIN, BVN, and more with SparklabID - trusted by businesses across Nigeria" />
    <meta name="author" content="SparklabID" />

    <!-- PWA Meta Tags -->
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SparklabID" />

    <meta property="og:title" content="SparklabID - Identity Verification at Lightning Speed" />
    <meta property="og:description" content="Lightning-fast Nigerian identity verification for NIN, BVN, and API workflows." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const registerServiceWorker = () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(error => {
              console.warn('Service Worker registration failed:', error);
            });
        };

        window.addEventListener('load', () => {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(registerServiceWorker, { timeout: 3000 });
          } else {
            window.setTimeout(registerServiceWorker, 1500);
          }
        });
      }
    </script>
  </body>
</html>
